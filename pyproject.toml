[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pvtmb"
version = "0.1.0"
description = "Black-oil PVT correlations and Havlena-Odeh material balance for OOIP and drive-mechanism analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pvtmb = "pvtmb.cli:main"

[tool.setuptools.packages.find]
include = ["pvtmb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
